const rx=q.p[0]-o.p[0],rz=q.p[1]-o.p[1],f=rx*o.d[0]+rz*o.d[1],l=Math.abs(-rx*o.d[1]+rz*o.d[0]);
if(f>0&&f<12&&l<2.6)tg=Math.min(tg,Math.max(0,q.sp*(f-5)/7))}
if(o.stun>0){o.stun-=dt;tg=0}
o.sp+=(tg-o.sp)*Math.min(1,(tg<o.sp?4:1.6)*dt);o.idle=o.sp<.5?(o.idle||0)+dt:0;if(o.idle>6){o.idle=0;spawn(o)}
const ax=o.d[0]?0:1,a0=o.p[ax];o.p[0]+=o.d[0]*o.sp*dt;o.p[1]+=o.d[1]*o.sp*dt;const a1=o.p[ax],c=Math.round(a1/C)*C;
if(a0!==a1&&(a0-c)*(a1-c)<0){const nd=ax?[Math.round(o.p[0]/C)*C,c]:[c,Math.round(o.p[1]/C)*C];
let ds=DIRS.filter(q=>!(q[0]==-o.d[0]&&q[1]==-o.d[1])),q;
if(chasing(o)){q=ds.reduce((b,e)=>Math.hypot(nd[0]+e[0]*C-P.x,nd[1]+e[1]*C-P.z)<Math.hypot(nd[0]+b[0]*C-P.x,nd[1]+b[1]*C-P.z)?e:b)}
else{ds=ds.concat(ds.filter(e=>e[0]==o.d[0]&&e[1]==o.d[1]),ds.filter(e=>e[0]==o.d[0]&&e[1]==o.d[1]));q=ds[Math.floor(rnd()*ds.length)]}
o.d=q;o.p=[nd[0]-q[1]*LANE+q[0]*.1,nd[1]+q[0]*LANE+q[1]*.1]}
const k=1-Math.exp(-7*dt);o.vx+=(o.p[0]-o.vx)*k;o.vz+=(o.p[1]-o.vz)*k;
const th=Math.atan2(o.d[0],o.d[1]);o.h+=wr(th-o.h)*Math.min(1,6*dt);
o.g.position.set(o.vx,0,o.vz);o.g.rotation.y=o.h;spin(o,o.sp,-cl(wr(th-o.h),-1,1),dt);
if(o.bar){const on=Math.sin(t*14)>0;o.bar[0].visible=on;o.bar[1].visible=!on}
const dd=Math.hypot(o.vx-P.x,o.vz-P.z);o.nm=(o.nm||0)-dt;if(playing&&dd>3.2&&dd<5.5&&Math.abs(P.v)>18&&o.nm<=0){o.nm=3;score+=60;say('ردشدن نزدیک +۶۰',.7)}
if(dd<3.1){const nx=(P.x-o.vx)/dd,nz=(P.z-o.vz)/dd;if(!solid(P.x+nx*(3.1-dd),P.z+nz*(3.1-dd))){P.x+=nx*(3.1-dd);P.z+=nz*(3.1-dd)}
if(Math.abs(P.v)>5){shake=1;dmg(Math.abs(P.v)*.7);if(!o.cop)heat=Math.min(100,heat+15)}P.v*=.6;o.stun=.7;o.sp*=.3}
return dd}
// ---------- input ----------
const K={l:0,r:0,gas:0,brk:0};let mode=0,au,eng,tiltOn=0,tilt=0,todMode=0,tod=.2;
function aud(){if(au){au.resume();return}try{au=new(window.AudioContext||webkitAudioContext)();const o=au.createOscillator(),f=au.createBiquadFilter(),g=au.createGain();o.type='sawtooth';f.type='lowpass';f.frequency.value=500;g.gain.value=.03;o.connect(f);f.connect(g);g.connect(au.destination);o.start();eng={o,g}}catch(e){}}
for(const[id,k]of[['bl','l'],['br','r'],['gas','gas'],['brk','brk']]){const e=$(id);
e.addEventListener('pointerdown',v=>{K[k]=1;aud();v.preventDefault()});
for(const n of['pointerup','pointercancel','pointerleave'])e.addEventListener(n,()=>K[k]=0)}
const KM={ArrowLeft:'l',a:'l',ArrowRight:'r',d:'r',ArrowUp:'gas',w:'gas',ArrowDown:'brk',s:'brk'};
const setGear=()=>{$('gr').textContent=$('grt').textContent=gear>0?'D':'R';$('grt').style.color=gear>0?'#7dff9a':'#ff6a5a'},sw=()=>{gear=-gear;setGear()};
addEventListener('keydown',e=>{if(KM[e.key]){K[KM[e.key]]=1;aud()}if(e.key=='c')mode^=1;if(e.key=='r')sw()});
addEventListener('keyup',e=>{if(KM[e.key])K[KM[e.key]]=0});
$('cam').addEventListener('pointerdown',()=>mode^=1);$('gr').addEventListener('pointerdown',e=>{sw();e.preventDefault()});
$('tm').addEventListener('pointerdown',()=>{todMode=(todMode+1)%3;$('tm').textContent='زمان: '+['خودکار','روز','شب'][todMode]});
$('tl').addEventListener('pointerdown',async()=>{tiltOn^=1;$('tl').classList.toggle('on',tiltOn);$('bl').style.display=$('br').style.display=tiltOn?'none':'flex';
try{if(tiltOn&&window.DeviceMotionEvent&&DeviceMotionEvent.requestPermission)await DeviceMotionEvent.requestPermission()}catch(e){}});
addEventListener('devicemotion',e=>{const a=e.accelerationIncludingGravity;if(!a||a.x==null)return;const th=Math.atan2((a.x<0?-1:1)*a.y,Math.abs(a.x));tilt=cl((Math.abs(th)<.05?0:th-Math.sign(th)*.05)/.5,-1,1)});
function say(t,sec){const m=$('msg');m.textContent=t;m.style.display='block';msgT=sec}
$('ot').textContent='اف‌گیم درایور ۳D';$('op').textContent='به دایره‌های سبز برس، قبل از تمام شدن زمان. هر نقطه زمان و جان می‌دهد. ۸ نقطه را بگیر تا برنده شوی. از پلیس فرار کن، تصادف نکن و ردشدن نزدیک از ماشین‌ها امتیاز دارد. دکمهٔ D/R دنده را عوض می‌کند و «فرمان گوشی» با چرخاندن گوشی فرمان می‌دهد.';
// ---------- physics ----------
function hit(x,z,h){const fx=Math.sin(h),fz=Math.cos(h),rx=-Math.cos(h),rz=Math.sin(h);
for(const a of[-2.1,2.1])for(const b of[-.95,.95])if(solid(x+fx*a+rx*b,z+fz*a+rz*b))return 1;return 0}
function bump(){if(Math.abs(P.v)>8){shake=Math.min(1,Math.abs(P.v)/25);heat=Math.min(100,heat+6);dmg(Math.abs(P.v)*.6)}P.v*=-.25}
function stepP(dt){
let a=0;if(K.gas){if(gear>0){if(P.v<52)a+=16}else if(P.v>-11)a-=9}
if(K.brk){if(Math.abs(P.v)>.3)a-=Math.sign(P.v)*34;else P.v=0}
a-=.006*P.v*Math.abs(P.v);if(!K.gas&&!K.brk)a-=Math.sign(P.v)*2;
P.v+=a*dt;if(!K.gas&&!K.brk&&Math.abs(P.v)<.3)P.v=0;
const sIn=cl(K.r-K.l+(tiltOn?tilt:0),-1,1);P.steer+=(sIn-P.steer)*Math.min(1,7*dt);
const nh=P.h-P.v/2.7*Math.tan(P.steer*.5/(1+Math.abs(P.v)*.07))*dt;if(!hit(P.x,P.z,nh))P.h=nh;
const fx=Math.sin(P.h),fz=Math.cos(P.h);let nx=P.x+fx*P.v*dt,nz=P.z+fz*P.v*dt;
if(hit(nx,P.z,P.h)){nx=P.x;bump()}if(hit(nx,nz,P.h)){nz=P.z;bump()}
P.x=nx;P.z=nz;P.pitch+=(-a*.0035-P.pitch)*Math.min(1,5*dt)}
// ---------- day / night ----------
const NIGHT=new T.Color(0x070b1c),DAY=new T.Color(0x8ec5ff),DUSK=new T.Color(0xff9a66),SC=new T.Color(),SN1=new T.Color(0xff9a60),SN2=new T.Color(0xffffff);
function sky(dt){if(todMode==0)tod=(tod+dt/240)%1;else tod+=((todMode==1?.25:.75)-tod)*Math.min(1,dt*1.5);
const h=Math.sin(tod*6.2832),d=cl(h*2.2+.45,0,1),du=Math.max(0,1-Math.abs(h)*4);
SC.lerpColors(NIGHT,DAY,d).lerp(DUSK,du*.6);sc.background.copy(SC);sc.fog.color.copy(SC);
hemi.intensity=.3+.9*d;sun.intensity=.1+1.2*d;sun.color.lerpColors(SN1,SN2,d);sun.position.set(Math.cos(tod*6.2832)*80,Math.max(15,h*90),40);
bmat.emissiveIntensity=.08+.9*(1-d);mHl.opacity=1-d;sc.environmentIntensity=.1+.9*d;spot.intensity=(1-d)*5}
// ---------- game: checkpoints, score, win/lose ----------
const GOAL=8;let playing=0,score=0,cpN=0,tleft=0,health=100,tgt=[0,0],best=0;try{best=+localStorage.getItem('f3best')||0}catch(e){}
const mk2=new T.Mesh(new T.CylinderGeometry(5,5,90,20,1,true),new T.MeshBasicMaterial({color:0x39ff88,transparent:true,opacity:.35,blending:T.AdditiveBlending,depthWrite:false,fog:false,side:T.DoubleSide}));mk2.position.y=45;
const ring=new T.Mesh(new T.TorusGeometry(6,.35,8,28),new T.MeshBasicMaterial({color:0x39ff88,fog:false}));ring.rotation.x=Math.PI/2;ring.position.y=.4;
mk2.visible=ring.visible=false;sc.add(mk2,ring);
function newTarget(){for(let t=0;t<20;t++){const i=Math.round(P.x/C)+Math.floor(Math.random()*11)-5,j=Math.round(P.z/C)+Math.floor(Math.random()*11)-5,d=Math.hypot(i*C-P.x,j*C-P.z);if((d>200&&d<420)||t==19){tgt=[i*C,j*C];tleft+=Math.round(d/11+14);break}}
mk2.position.x=ring.position.x=tgt[0];mk2.position.z=ring.position.z=tgt[1]}
function dmg(a){if(!playing)return;health=Math.max(0,health-a);if(health<=0)endGame(0,'ماشین نابود شد')}
function endGame(win,why){playing=0;heat=0;K.gas=K.brk=0;best=Math.max(best,Math.round(score));try{localStorage.setItem('f3best',best)}catch(e){}
$('ot').textContent=win?'برنده شدی! 🏆':'باختی';$('op').textContent=why+' — امتیاز: '+Math.round(score)+' | بهترین: '+best;$('go').textContent='دوباره';$('ov').style.display='flex';mk2.visible=ring.visible=false}
function startGame(){aud();$('ov').style.display='none';playing=1;score=0;cpN=0;health=100;tleft=0;heat=0;bust=0;P.x=-LANE;P.z=-20;P.h=0;P.v=0;P.steer=0;gear=1;setGear();ais.forEach(o=>spawn(o));newTarget();mk2.visible=ring.visible=true;say('به دایرهٔ سبز برس!',3)}
$('go').addEventListener('pointerdown',startGame);
// ---------- loop ----------
let last=performance.now(),cyaw=0,fr=0;
function frame(now){requestAnimationFrame(frame);const dt=Math.min(.05,(now-last)/1e3);last=now;const t=now/1e3;
if(playing)stepP(dt);upd();sky(dt);gr.position.set(P.x,0,P.z);
let near=1e9;for(const o of ais){const d=stepAI(o,dt,t);if(o.cop)near=Math.min(near,d)}
if(playing){if(Math.abs(P.v)>30)heat=Math.min(100,heat+6*dt);else if(near>70)heat=Math.max(0,heat-3*dt)}
if(playing&&heat>20&&near<7&&Math.abs(P.v)<9){bust+=dt;if(bust>1.6){bust=0;endGame(0,'پلیس دستگیرت کرد')}}else bust=Math.max(0,bust-dt);
if(playing){tleft-=dt;score+=Math.abs(P.v)*dt*.15;const dx=tgt[0]-P.x,dz=tgt[1]-P.z,dg=Math.hypot(dx,dz);
if(dg<12){cpN++;score+=500+tleft*10;health=Math.min(100,health+20);if(cpN>=GOAL)endGame(1,'همهٔ نقطه‌ها را گرفتی');else{newTarget();say('نقطه '+cpN+' از '+GOAL+' ✓',1.5)}}else if(tleft<=0)endGame(0,'زمان تمام شد');
$('ar').style.transform='rotate('+(-wr(Math.atan2(dx,dz)-P.h))+'rad)';$('dist').textContent=Math.round(dg)+' m';
$('info').textContent='⏱ '+Math.max(0,Math.ceil(tleft))+' | 🏁 '+cpN+'/'+GOAL+' | ⭐ '+Math.round(score);$('hp').style.width=health+'%';$('hp').style.background=health>50?'#3be07a':health>25?'#ffc83c':'#ff4a3c'}
$('arr').style.display=playing?'block':'none';
me.g.position.set(P.x,0,P.z);me.g.rotation.set(P.pitch,P.h,P.steer*Math.min(1,Math.abs(P.v)/30)*.05);
me.tl.color.set(K.brk&&Math.abs(P.v)>.3?0xff2a2a:(K.gas&&gear<0?0xe8e8e8:0x8a1212));spin(me,P.v,P.steer,dt);
const fx=Math.sin(P.h),fz=Math.cos(P.h);
spot.position.set(P.x+fx*2,1,P.z+fz*2);spot.target.position.set(P.x+fx*30,0,P.z+fz*30);
shake=Math.max(0,shake-dt*2.5);const sh=shake*.35+Math.abs(P.v)*.0012;
if(mode==0){cyaw+=wr(P.h-cyaw)*Math.min(1,5*dt);const cx=Math.sin(cyaw),cz=Math.cos(cyaw),dist=7+Math.abs(P.v)*.04;
cam.position.set(P.x-cx*dist,2.8+(Math.random()-.5)*sh*.3,P.z-cz*dist);cam.lookAt(P.x+cx*8,1.3,P.z+cz*8);me.g.visible=1;dash.visible=0}
else{cyaw=P.h;cam.position.set(P.x+fx*.2+Math.cos(P.h)*.4,1.2+Math.sin(t*40)*sh*.12,P.z+fz*.2-Math.sin(P.h)*.4);
cam.lookAt(P.x+fx*12,1.1+P.pitch*8,P.z+fz*12);me.g.visible=0;dash.visible=1;wS.rotation.z=-P.steer*1.6;
const v=Math.abs(P.v),g=Math.min(5,Math.floor(v/9)+1),rpm=Math.min(8000,900+(v-(g-1)*9)/9*5200);
if((fr++&3)==0)drawCl(v*3.6,rpm,gear<0?'R':g)}
cam.rotateZ(-P.steer*P.v*.0006+(Math.random()-.5)*sh*.02);
cam.fov+=((mode?74:62)+Math.abs(P.v)*.4-cam.fov)*Math.min(1,4*dt);cam.updateProjectionMatrix();
if(eng){eng.o.frequency.value=38+Math.abs(P.v)*3.4+(K.gas?12:0);eng.g.gain.value=.03+(K.gas?.035:0)}
$('spd').firstChild.nodeValue=Math.round(Math.abs(P.v)*3.6)+' ';
const n=Math.ceil(heat/20);$('heat').textContent='★'.repeat(n)+'☆'.repeat(5-n);
if(msgT>0&&(msgT-=dt)<=0)$('msg').style.display='none';
ren.render(sc,cam)}
setGear();requestAnimationFrame(frame);
</script>
