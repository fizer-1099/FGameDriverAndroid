<script type="module">
import * as T from './3d/three.module.js';
const N=8,C=60,R=8,W=N*C,LANE=4;
const $=id=>document.getElementById(id);
let s=7;const rnd=()=>(s=(s*16807)%2147483647)/2147483647;
const wr=a=>Math.atan2(Math.sin(a),Math.cos(a));
const ren=new T.WebGLRenderer({antialias:false});
ren.setPixelRatio(Math.min(devicePixelRatio,2));ren.setSize(innerWidth,innerHeight);document.body.prepend(ren.domElement);
const sc=new T.Scene();sc.background=new T.Color(0x4a4672);sc.fog=new T.Fog(0x4a4672,45,240);
const cam=new T.PerspectiveCamera(65,innerWidth/innerHeight,.3,400);sc.add(cam);
sc.add(new T.HemisphereLight(0xffb48a,0x1d2244,1.15));
const sun=new T.DirectionalLight(0xffc08a,1.1);sun.position.set(-60,80,40);sc.add(sun);
addEventListener('resize',()=>{ren.setSize(innerWidth,innerHeight);cam.aspect=innerWidth/innerHeight;cam.updateProjectionMatrix()});

// ---------- city ----------
function tex(emit){const c=document.createElement('canvas');c.width=c.height=128;const g=c.getContext('2d');let q=11;const r=()=>(q=(q*16807)%2147483647)/2147483647;
g.fillStyle=emit?'#000':'#fff';g.fillRect(0,0,128,128);
for(let i=0;i<8;i++)for(let j=0;j<8;j++){const l=r()<.5;g.fillStyle=emit?(l?'#ffcf7a':'#000'):(l?'#ffe9b0':'#222a44');g.fillRect(i*16+3,j*16+4,10,9)}
const t=new T.CanvasTexture(c);t.wrapS=t.wrapT=T.RepeatWrapping;t.colorSpace=T.SRGBColorSpace;return t}
const tm=tex(0),te=tex(1);
const mats=[0xb9b2a8,0x9aa3b5,0xc7a58a,0x8b8f99,0xa8b59a].map(c=>new T.MeshLambertMaterial({color:c,map:tm,emissive:0xffffff,emissiveMap:te,emissiveIntensity:.9}));
function bld(x,z,w,d,h,m){const g=new T.BoxGeometry(w,h,d),uv=g.attributes.uv;
const k=[[d/16,h/24],[d/16,h/24],[0,0],[0,0],[w/16,h/24],[w/16,h/24]];
for(let f=0;f<6;f++)for(let i=0;i<4;i++){const n=f*4+i,[a,b]=k[f];uv.setXY(n,a?uv.getX(n)*a:.02,b?uv.getY(n)*b:.02)}
const e=new T.Mesh(g,m);e.position.set(x,h/2+.3,z);sc.add(e)}
const gr=new T.Mesh(new T.PlaneGeometry(W+500,W+500),new T.MeshLambertMaterial({color:0x2a2c37}));
gr.rotation.x=-Math.PI/2;gr.position.set(W/2,0,W/2);sc.add(gr);
const slabG=new T.BoxGeometry(C-2*R,.3,C-2*R),slabM=new T.MeshLambertMaterial({color:0x666a7a});
for(let i=0;i<N;i++)for(let j=0;j<N;j++){const cx=(i+.5)*C,cz=(j+.5)*C;
const sl=new T.Mesh(slabG,slabM);sl.position.set(cx,.15,cz);sc.add(sl);
const mid=Math.max(0,1-Math.hypot(i-N/2+.5,j-N/2+.5)/(N*.6));
for(let a=0;a<2;a++)for(let b=0;b<2;b++)bld(cx+(a?10.5:-10.5),cz+(b?10.5:-10.5),13+rnd()*5,13+rnd()*5,10+rnd()*(22+mid*70),mats[Math.floor(rnd()*5)])}
// lane dashes
const dm=new T.MeshBasicMaterial({color:0xe8e2c0}),dz=new T.PlaneGeometry(.3,3).rotateX(-Math.PI/2),dx=new T.PlaneGeometry(3,.3).rotateX(-Math.PI/2);
const dl=[];for(let r=0;r<=N;r++)for(let t=0;t<W;t+=8){const m=t%C;if(m<R+3||m>C-R-3)continue;dl.push([r*C,t+4,0],[t+4,r*C,1])}
const di=[new T.InstancedMesh(dz,dm,dl.length),new T.InstancedMesh(dx,dm,dl.length)],dc=[0,0],M4=new T.Matrix4();
dl.forEach(([x,z,k])=>{M4.makeTranslation(x,.03,z);di[k].setMatrixAt(dc[k]++,M4)});
di.forEach((m,k)=>{m.count=dc[k];sc.add(m)});
// street lamps
const lp=[];for(let i=0;i<=N;i++)for(let j=0;j<=N;j++)for(const sx of[-1,1])for(const sz of[-1,1])lp.push([i*C+sx*(R+1.5),j*C+sz*(R+1.5)]);
const poles=new T.InstancedMesh(new T.CylinderGeometry(.12,.12,7),new T.MeshLambertMaterial({color:0x30343f}),lp.length);
const heads=new T.InstancedMesh(new T.SphereGeometry(.45,6,5),new T.MeshBasicMaterial({color:0xffe3a0}),lp.length);
lp.forEach(([x,z],i)=>{M4.makeTranslation(x,3.5,z);poles.setMatrixAt(i,M4);M4.makeTranslation(x,7.1,z);heads.setMatrixAt(i,M4)});
sc.add(poles,heads);
const rd=v=>{const m=((v%C)+C)%C;return m<R||m>C-R};
const solid=(x,z)=>x<-R+1||z<-R+1||x>W+R-1||z>W+R-1||(!rd(x)&&!rd(z));

// ---------- cars ----------
const gB=new T.BoxGeometry(1,1,1),gT=new T.CylinderGeometry(1,1,1,18).rotateZ(Math.PI/2);
const mGl=new T.MeshPhongMaterial({color:0x0a111c,shininess:120,specular:0x99aacc}),mTire=new T.MeshLambertMaterial({color:0x0b0b0d}),mBk=new T.MeshLambertMaterial({color:0x08080a}),mHd=new T.MeshBasicMaterial({color:0xfff6dc}),mPl=new T.MeshBasicMaterial({color:0xeeeeee}),mChr=new T.MeshPhongMaterial({color:0xc4c9d2,shininess:90});
function gt(a){const c=document.createElement('canvas');c.width=c.height=64;const g=c.getContext('2d'),r=g.createRadialGradient(32,32,2,32,32,31);r.addColorStop(0,'rgba(255,255,255,'+a+')');r.addColorStop(1,'rgba(255,255,255,0)');g.fillStyle=r;g.fillRect(0,0,64,64);return new T.CanvasTexture(c)}
const mSh=new T.MeshBasicMaterial({color:0,map:gt(.75),transparent:true,depthWrite:false}),mHl=new T.MeshBasicMaterial({color:0xffe6b0,map:gt(.5),transparent:true,blending:T.AdditiveBlending,depthWrite:false});
const TY={
sedan:{Wd:1.8,body:[[-2.25,.4],[-2.25,.95],[-1.6,1.02],[1.2,1],[2.1,.84],[2.25,.6],[2.2,.4]],cab:[[-1.5,1],[-.95,1.55],[.45,1.55],[1.05,1]],r:.34,wz:1.4,hl:[2.15,.72]},
hatch:{Wd:1.75,body:[[-1.95,.4],[-1.95,1],[1,1],[1.8,.82],[1.95,.6],[1.9,.4]],cab:[[-1.9,1],[-1.65,1.6],[.3,1.6],[.95,1]],r:.32,wz:1.15,hl:[1.88,.7]},
suv:{Wd:1.95,body:[[-2.35,.5],[-2.35,1.2],[1.4,1.2],[2.2,1.05],[2.35,.8],[2.3,.5]],cab:[[-2.3,1.2],[-2.2,1.95],[.7,1.95],[1.35,1.2]],r:.44,wz:1.5,hl:[2.3,.95]},
sport:{Wd:1.95,body:[[-2.2,.35],[-2.2,.8],[-1.3,.88],[1,.78],[2.2,.55],[2.2,.35]],cab:[[-1,.84],[-.6,1.25],[.2,1.25],[.95,.8]],r:.35,wz:1.35,hl:[2.05,.6],sp:1},
pick:{Wd:1.9,body:[[-2.4,.5],[-2.4,1.1],[.2,1.1],[1.4,1.05],[2.3,.85],[2.35,.5]],cab:[[-.1,1.08],[.1,1.8],[1,1.8],[1.45,1.08]],r:.42,wz:1.5,hl:[2.28,.85],bed:1}};
const TYN=['sedan','sedan','hatch','hatch','suv','pick','sport'];
function ex(pts,w,m,bv){const s=new T.Shape();pts.forEach((p,i)=>i?s.lineTo(p[0],p[1]):s.moveTo(p[0],p[1]));
const d=w-2*bv,g=new T.ExtrudeGeometry(s,{depth:d,bevelEnabled:true,bevelThickness:bv,bevelSize:bv,bevelSegments:2,steps:1});
g.translate(0,0,-d/2);g.rotateY(-Math.PI/2);return new T.Mesh(g,m)}
function mk(ty,col,cop){const S=TY[ty],W=S.Wd,g=new T.Group(),bm=new T.MeshPhongMaterial({color:col,shininess:100,specular:0x777777}),tl=new T.MeshBasicMaterial({color:0x8a1212});
const add=(w,h,d,x,y,z,m)=>{const e=new T.Mesh(gB,m);e.scale.set(w,h,d);e.position.set(x,y,z);g.add(e);return e};
const f=S.body[S.body.length-1][0],rr=S.body[0][0],cb=S.cab,top=cb[1][1],cz=(cb[1][0]+cb[2][0])/2;
g.add(ex(S.body,W,bm,.07));g.add(ex(cb,W-.18,mGl,.04));
add(W-.2,.07,cb[2][0]-cb[1][0]+.12,0,top+.04,cz,bm);
add(W-.1,.22,.14,0,.5,f+.03,mBk);add(W-.1,.22,.14,0,.5,rr-.03,mBk);add(W*.5,.15,.06,0,S.hl[1]-.12,f+.04,mBk);
add(.5,.12,.03,0,.5,f+.11,mPl);add(.5,.12,.03,0,.5,rr-.11,mPl);
const ty2=S.body[1][1]-.12;
for(const x of[-1,1]){add(.42,.13,.1,x*(W/2-.35),S.hl[1],S.hl[0],mHd);add(.4,.1,.08,x*(W/2-.3),ty2,rr-.01,tl);add(.12,.1,.2,x*(W/2+.08),cb[0][1]+.1,cb[3][0]-.25,bm)}
add(W-1,.05,.08,0,ty2,rr-.01,tl);
if(S.sp){add(W-.2,.05,.45,0,.98,rr+.05,bm);for(const x of[-.6,.6])add(.06,.2,.06,x,.88,rr+.1,mBk)}
if(S.bed)add(W-.3,.04,2.3,0,S.body[1][1]+.02,-1.2,mBk);
if(cop)for(const x of[-1,1])add(.02,.34,2,x*(W/2+.012),.72,-.2,mBk);
let bar=null;if(cop){add(.9,.07,.32,0,top+.1,cz,mBk);bar=[add(.4,.12,.28,-.2,top+.16,cz,new T.MeshBasicMaterial({color:0xff2020})),add(.4,.12,.28,.2,top+.16,cz,new T.MeshBasicMaterial({color:0x2060ff}))]}
const wh=[],r=S.r;
for(const x of[-1,1])for(const z of[-1,1]){const piv=new T.Group(),sp=new T.Group();piv.position.set(x*(W/2-.12),r,z*S.wz);piv.add(sp);g.add(piv);
const ar=new T.Mesh(gT,mBk);ar.scale.set(.05,r*1.2,r*1.2);ar.position.set(x*(W/2+.005),r,z*S.wz);g.add(ar);
const t=new T.Mesh(gT,mTire);t.scale.set(.3,r,r);const rm=new T.Mesh(gT,mChr);rm.scale.set(.32,r*.64,r*.64);
const s1=new T.Mesh(gB,mBk);s1.scale.set(.34,r*1.1,.06);const s2=new T.Mesh(gB,mBk);s2.scale.set(.34,.06,r*1.1);sp.add(t,rm,s1,s2);wh.push({piv,spin:sp,f:z>0,r})}
const sh=new T.Mesh(new T.PlaneGeometry(W+1,f-rr+1.4),mSh);sh.rotation.x=-Math.PI/2;sh.position.y=.04;g.add(sh);
const hp=new T.Mesh(new T.PlaneGeometry(7,12),mHl);hp.rotation.x=-Math.PI/2;hp.position.set(0,.05,f+7);g.add(hp);
return{g,tl,bar,wh}}
function spin(o,v,st,dt){for(const w of o.wh){w.spin.rotation.x+=v*dt/w.r;if(w.f)w.piv.rotation.y=-st*.45}}
const me=mk('sport',0xd8262f,0);me.g.rotation.order='YXZ';sc.add(me.g);
// cockpit dash (attached to camera)
const dash=new T.Group(),dm2=new T.MeshLambertMaterial({color:0x15171d});
const db=new T.Mesh(gB,dm2);db.scale.set(2.2,.4,.5);db.position.set(0,-.62,-.95);dash.add(db);
const wheel=new T.Mesh(new T.TorusGeometry(.2,.03,6,16),dm2);wheel.position.set(.35,-.38,-.7);wheel.rotation.x=-.5;dash.add(wheel);
cam.add(dash);

const P={x:W/2+LANE,z:W/2-30,h:0,v:0,steer:0,pitch:0};
const ais=[],cols=[0x2e5aa8,0xe0b020,0x2a8a5a,0x777b86,0xb04a2a,0x1e1e24,0xdadada,0x6a1f2e,0x1d3b66,0xc9ccd4];
const inside=(x,z)=>x>=0&&x<=W&&z>=0&&z<=W,DIRS=[[1,0],[-1,0],[0,1],[0,-1]];
let heat=0;
function spawn(o,near){for(let t=0;t<30;t++){
let i=Math.floor(rnd()*(N+1)),j=Math.floor(rnd()*(N+1));
if(near){i=Math.min(N,Math.max(0,Math.round(P.x/C)+Math.floor(rnd()*5)-2));j=Math.min(N,Math.max(0,Math.round(P.z/C)+Math.floor(rnd()*5)-2))}
const ds=DIRS.filter(q=>inside(i*C+q[0]*C,j*C+q[1]*C));const d=ds[Math.floor(rnd()*ds.length)];const a=rnd()*C*.8;
const x=i*C-d[1]*LANE+d[0]*a,z=j*C+d[0]*LANE+d[1]*a;
if(Math.hypot(x-P.x,z-P.z)>45||t==29){o.d=d;o.p=[x,z];o.vx=x;o.vz=z;o.h=Math.atan2(d[0],d[1]);o.sp=8;o.stun=0;return}}}
function mkAI(cop){const o=mk(cop?'sedan':TYN[Math.floor(rnd()*TYN.length)],cop?0xf4f4f4:cols[Math.floor(rnd()*cols.length)],cop);o.cop=cop;o.base=9+rnd()*6;spawn(o,0);sc.add(o.g);ais.push(o)}
for(let i=0;i<18;i++)mkAI(0);for(let i=0;i<4;i++)mkAI(1);
const chasing=o=>o.cop&&heat>20;
function stepAI(o,dt,t){
let tg=o.cop?(chasing(o)?22+heat*.12:12):o.base;
for(const q of ais.concat(chasing(o)?[]:[{p:[P.x,P.z],sp:Math.abs(P.v)}])){if(q===o)continue;
const rx=q.p[0]-o.p[0],rz=q.p[1]-o.p[1],f=rx*o.d[0]+rz*o.d[1],l=Math.abs(-rx*o.d[1]+rz*o.d[0]);
if(f>0&&f<12&&l<2.6)tg=Math.min(tg,Math.max(0,q.sp*(f-5)/7))}
if(o.stun>0){o.stun-=dt;tg=0}
o.sp+=(tg-o.sp)*Math.min(1,(tg<o.sp?4:1.6)*dt);
const ax=o.d[0]?0:1,a0=o.p[ax];o.p[0]+=o.d[0]*o.sp*dt;o.p[1]+=o.d[1]*o.sp*dt;const a1=o.p[ax],c=Math.round(a1/C)*C;
if(a0!==a1&&(a0-c)*(a1-c)<=0){const nd=ax?[Math.round(o.p[0]/C)*C,c]:[c,Math.round(o.p[1]/C)*C];
let ds=DIRS.filter(q=>!(q[0]==-o.d[0]&&q[1]==-o.d[1])&&inside(nd[0]+q[0]*C,nd[1]+q[1]*C));if(!ds.length)ds=DIRS.filter(q=>inside(nd[0]+q[0]*C,nd[1]+q[1]*C));
let q;if(chasing(o)){q=ds.reduce((b,e)=>Math.hypot(nd[0]+e[0]*C-P.x,nd[1]+e[1]*C-P.z)<Math.hypot(nd[0]+b[0]*C-P.x,nd[1]+b[1]*C-P.z)?e:b)}
else{ds=ds.concat(ds.filter(e=>e[0]==o.d[0]&&e[1]==o.d[1]),ds.filter(e=>e[0]==o.d[0]&&e[1]==o.d[1]));q=ds[Math.floor(rnd()*ds.length)]}
o.d=q;o.p=[nd[0]-q[1]*LANE,nd[1]+q[0]*LANE]}
const k=1-Math.exp(-7*dt);o.vx+=(o.p[0]-o.vx)*k;o.vz+=(o.p[1]-o.vz)*k;
o.h+=wr(Math.atan2(o.d[0],o.d[1])-o.h)*Math.min(1,6*dt);
o.g.position.set(o.vx,0,o.vz);o.g.rotation.y=o.h;spin(o,o.sp,-Math.max(-1,Math.min(1,wr(Math.atan2(o.d[0],o.d[1])-o.h))),dt);
if(o.bar){const on=Math.sin(t*14)>0;o.bar[0].visible=on;o.bar[1].visible=!on}
const dd=Math.hypot(o.vx-P.x,o.vz-P.z);
if(dd<3.1){const nx=(P.x-o.vx)/dd,nz=(P.z-o.vz)/dd;P.x+=nx*(3.1-dd);P.z+=nz*(3.1-dd);if(!solid(P.x,P.z)){}else{P.x-=nx*(3.1-dd);P.z-=nz*(3.1-dd)}
if(Math.abs(P.v)>5){shake=1;if(!o.cop)heat=Math.min(100,heat+15)}P.v*=.6;o.stun=.7;o.sp*=.3}
return dd}

// ---------- input ----------
const K={l:0,r:0,gas:0,brk:0};let mode=0,au,eng;
function aud(){if(au){au.resume();return}try{au=new(window.AudioContext||webkitAudioContext)();const o=au.createOscillator(),f=au.createBiquadFilter(),g=au.createGain();o.type='sawtooth';f.type='lowpass';f.frequency.value=500;g.gain.value=.03;o.connect(f);f.connect(g);g.connect(au.destination);o.start();eng={o,g}}catch(e){}}
for(const[id,k]of[['bl','l'],['br','r'],['gas','gas'],['brk','brk']]){const e=$(id);
e.addEventListener('pointerdown',v=>{K[k]=1;aud();v.preventDefault()});
for(const n of['pointerup','pointercancel','pointerleave'])e.addEventListener(n,()=>K[k]=0)}
const KM={ArrowLeft:'l',a:'l',ArrowRight:'r',d:'r',ArrowUp:'gas',w:'gas',ArrowDown:'brk',s:'brk'};
addEventListener('keydown',e=>{if(KM[e.key]){K[KM[e.key]]=1;aud()}if(e.key=='c')mode^=1});
addEventListener('keyup',e=>{if(KM[e.key])K[KM[e.key]]=0});
$('cam').addEventListener('pointerdown',()=>mode^=1);
let shake=0,bust=0,msgT=0;
function say(t,sec){const m=$('msg');m.textContent=t;m.style.display='block';msgT=sec}
say('از پلیس فرار کن! سرعت زیاد یا تصادف، تعقیب را شروع می‌کند',4);

function hit(x,z,h){const fx=Math.sin(h),fz=Math.cos(h),rx=-Math.cos(h),rz=Math.sin(h);
for(const a of[-2.1,2.1])for(const b of[-.95,.95])if(solid(x+fx*a+rx*b,z+fz*a+rz*b))return 1;return 0}
function stepP(dt){
let a=0;if(K.gas)a+=16;if(K.brk)a-=P.v>.5?34:(P.v>-9?12:0);
a-=.006*P.v*Math.abs(P.v);if(!K.gas&&!K.brk)a-=Math.sign(P.v)*2;
P.v+=a*dt;if(!K.gas&&!K.brk&&Math.abs(P.v)<.3)P.v=0;
P.steer+=(K.r-K.l-P.steer)*Math.min(1,7*dt);
const nh=P.h-P.v/2.7*Math.tan(P.steer*.5/(1+Math.abs(P.v)*.07))*dt;if(!hit(P.x,P.z,nh))P.h=nh;
const fx=Math.sin(P.h),fz=Math.cos(P.h);let nx=P.x+fx*P.v*dt,nz=P.z+fz*P.v*dt;
if(hit(nx,P.z,P.h)){nx=P.x;bump()}if(hit(nx,nz,P.h)){nz=P.z;bump()}
P.x=nx;P.z=nz;P.pitch+=(-a*.0035-P.pitch)*Math.min(1,5*dt)}
function bump(){if(Math.abs(P.v)>8){shake=Math.min(1,Math.abs(P.v)/25);heat=Math.min(100,heat+6)}P.v*=-.25}

// ---------- loop ----------
let last=performance.now(),cyaw=0;
function frame(now){requestAnimationFrame(frame);const dt=Math.min(.05,(now-last)/1e3);last=now;const t=now/1e3;
