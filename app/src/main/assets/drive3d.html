const save=()=>{try{localStorage.setItem('f3save',JSON.stringify(SV))}catch(e){}},vib=ms=>{if(SV.vib&&navigator.vibrate)try{navigator.vibrate(ms)}catch(e){}};
const CARS=[{id:'hatch',ty:'hatch',n:'هاچ‌بک شهری',p:0,vm:44,ac:13,hn:1,ar:1},{id:'sedan',ty:'sedan',n:'سدان',p:3000,vm:48,ac:14.5,hn:1,ar:.9},{id:'suv',ty:'suv',n:'شاسی‌بلند',p:6000,vm:46,ac:15,hn:.9,ar:.65},
{id:'pick',ty:'pick',n:'پیکاپ',p:8000,vm:47,ac:15.5,hn:.88,ar:.6},{id:'sport',ty:'sport',n:'اسپرت',p:15000,vm:56,ac:18,hn:1.15,ar:1.1},{id:'super',ty:'sport',n:'سوپراسپرت',p:30000,vm:64,ac:21,hn:1.25,ar:1.2}];
const COLS=[0xd8262f,0x2e5aa8,0xe0b020,0x2a8a5a,0x1e1e24,0xdadada,0x6a1f2e,0xff7a1a],UPS=[['eng','موتور'],['nit','نیترو'],['tir','لاستیک'],['arm','بدنه']];
const MIS={cp:['چک‌پوینت','۸ دایرهٔ سبز را قبل از تمام شدن زمان بگیر','به دایرهٔ سبز برس!'],esc:['فرار از پلیس','۹۰ ثانیه از دست پلیس‌ها زنده بمان','پلیس‌ها دنبالتند! فرار کن'],
del:['تحویل بار','بار را از نقطهٔ آبی بردار و به نقطهٔ سبز برسان. تصادف با بار خطرناک‌تر است','برو سراغ نقطهٔ آبی'],race:['مسابقه','قبل از ۳ رقیب به ۴ نقطه برس','مسابقه شروع شد!']},GOALS={cp:8,del:6};
let ST={},playing=0,score=0,cpN=0,tleft=0,health=100,tgt=[0,0],mis='cp',carry=0,rs=[0,0,0],pg='main';
const up=k=>SV.up[SV.car+':'+k]||0;
function stats(){const c=CARS.find(x=>x.id==SV.car);ST={vm:c.vm+2*up('eng'),acc:c.ac*(1+.08*up('eng')),hnd:c.hn*(1+.06*up('tir')),brk:1+.12*up('tir'),nc:1+.3*up('nit'),nr:1+.3*up('nit'),arm:c.ar*(1-.12*up('arm'))}}
function setCar(){const c=CARS.find(x=>x.id==SV.car),col=COLS[SV.col[c.id]||0];sc.remove(me.g);me=mk(c.ty,col,0);me.g.rotation.order='YXZ';sc.add(me.g);hoodM.color.set(col);stats()}
function applySet(){ren.setPixelRatio(Math.min(devicePixelRatio,[1,1.25,1.5][SV.q]));ren.setSize(innerWidth,innerHeight);RAD=[3,4,5][SV.q];sc.fog.far=[170,235,300][SV.q];bk=''}
const mk2=new T.Mesh(new T.CylinderGeometry(5,5,90,20,1,true),new T.MeshBasicMaterial({color:0x39ff88,transparent:true,opacity:.35,blending:T.AdditiveBlending,depthWrite:false,fog:false,side:T.DoubleSide}));mk2.position.y=45;
const ring=new T.Mesh(new T.TorusGeometry(6,.35,8,28),new T.MeshBasicMaterial({color:0x39ff88,fog:false}));ring.rotation.x=Math.PI/2;ring.position.y=.4;
mk2.visible=ring.visible=false;sc.add(mk2,ring);
const rac=[];for(let i=0;i<3;i++){const o=mk('sport',[0xff7a1a,0x39a0ff,0xf0f0f0][i],0);o.cop=0;o.base=22;o.race=1;o.off=1;spawn(o);o.g.visible=false;sc.add(o.g);ais.push(o);rac.push(o)}
function newTarget(){for(let t=0;t<20;t++){const i=Math.round(P.x/C)+Math.floor(Math.random()*11)-5,j=Math.round(P.z/C)+Math.floor(Math.random()*11)-5,d=Math.hypot(i*C-P.x,j*C-P.z);if((d>200&&d<420)||t==19){tgt=[i*C,j*C];tleft+=Math.round(d/11+14);break}}
mk2.position.x=ring.position.x=tgt[0];mk2.position.z=ring.position.z=tgt[1];const c=(mis=='del'&&!carry)?0x3aa0ff:0x39ff88;mk2.material.color.set(c);ring.material.color.set(c)}
function dmg(a){if(!playing)return;vib(Math.min(250,a*8));health=Math.max(0,health-a*ST.arm*(mis=='del'&&carry?1.6:1));if(health<=0)endGame(0,'ماشین نابود شد')}
function take(w){if(mis=='race'){if(w){rs[w-1]++;if(rs[w-1]>=4){endGame(0,'رقیب زودتر رسید');return}say('رقیب نقطه را گرفت',1)}else{cpN++;score+=300;if(cpN>=4){endGame(1,'مسابقه را بردی');return}say('نقطه را گرفتی '+cpN+'/4',1.2)}newTarget();return}
cpN++;score+=500+tleft*10;health=Math.min(100,health+20);if(mis=='del')carry^=1;if(cpN>=GOALS[mis]){endGame(1,mis=='del'?'همهٔ بارها تحویل شد':'همهٔ نقطه‌ها را گرفتی');return}
newTarget();say(mis=='del'?(carry?'بار برداشته شد؛ به نقطهٔ سبز برو':'تحویل شد ✓'):'نقطه '+cpN+' از '+GOALS.cp+' ✓',1.5)}
function endGame(win,why){playing=0;heat=0;K.gas=K.brk=0;mk2.visible=ring.visible=false;const rw=Math.round(score*(win?1:.4)+(win?400:0));SV.money+=rw;SV.best=Math.max(SV.best,Math.round(score));save();page('end',{win,why,rw})}
function startGame(m){aud();mis=m;ov.style.display='none';playing=1;score=0;cpN=0;health=100;nitE=100;tleft=0;heat=0;bust=0;carry=0;rs=[0,0,0];P.x=-LANE;P.z=-20;P.h=0;P.v=0;P.steer=0;gear=1;setGear();
ais.forEach(o=>{o.off=o.race&&m!='race'?1:0;o.g.visible=!o.off;if(!o.off)spawn(o)});
if(m=='esc'){tleft=90;heat=70;mk2.visible=ring.visible=false}else{newTarget();mk2.visible=ring.visible=true}
if(m=='race')rac.forEach(o=>o.stun=2.5);say(MIS[m][2],3)}
const ov=$('ov'),QN=['پایین','متوسط','بالا'];
const B=(a,t,c,v)=>'<div class="bt '+(c||'')+'" data-a="'+a+'" data-v="'+(v||'')+'">'+t+'</div>',top=()=>'<div style="font-size:14px;margin:4px">💰 '+SV.money+' &nbsp; ⭐ بهترین '+SV.best+'</div>';
function page(n,x){pg=n;let h='';
if(n=='main')h='<h2 style="margin:6px">اف‌گیم درایور ۳D</h2>'+top()+B('mis','شروع مأموریت')+B('gar','گاراژ','g')+B('set','تنظیمات','g')+'<a class="bt g" href="index.html" style="text-decoration:none">بازی ۲D</a>';
else if(n=='mis')h=top()+Object.keys(MIS).map(k=>B('go','<b>'+MIS[k][0]+'</b><br><small>'+MIS[k][1]+'</small>','',k)).join('')+B('main','بازگشت','g');
else if(n=='gar')h=top()+'<div class="sc">'+CARS.map(c=>'<div class="cd'+(c.id==SV.car?' sel':'')+'" data-a="car" data-v="'+c.id+'"><b>'+c.n+'</b><br>'+(SV.owned.includes(c.id)?(c.id==SV.car?'انتخاب‌شده':'مال شما'):'💰 '+c.p)+'<br>🚀'+c.vm+' ⚡'+c.ac+'</div>').join('')+'</div>'
+'<div>'+COLS.map((c,i)=>'<span class="dot" style="background:#'+c.toString(16).padStart(6,'0')+'" data-a="col" data-v="'+i+'"></span>').join('')+'</div>'
+UPS.map(u=>{const l=up(u[0]);return '<div class="row"><span>'+u[1]+' سطح '+l+'/3</span>'+(l<3?'<span class="bt" style="margin:0;padding:6px 12px;font-size:14px" data-a="up" data-v="'+u[0]+'">ارتقا 💰'+1500*(l+1)+'</span>':'<span>حداکثر</span>')+'</div>'}).join('')+B('main','بازگشت','g');
else if(n=='set')h=[['کیفیت گرافیک',QN[SV.q],'q'],['آینه‌ها',SV.mir?'روشن':'خاموش','mir'],['لرزش',SV.vib?'روشن':'خاموش','vib'],['صدا',SV.vol*100+'٪','vol'],['فرمان گوشی',SV.inv?'معکوس':'عادی','inv'],['حساسیت فرمان',SV.sens==1?'متوسط':SV.sens>1?'زیاد':'کم','sens']]
.map(r=>'<div class="bt g" data-a="s" data-v="'+r[2]+'" style="display:flex;justify-content:space-between"><span>'+r[0]+'</span><span>'+r[1]+'</span></div>').join('')+B('main','بازگشت','g');
else if(n=='end')h='<h2 style="margin:6px">'+(x.win?'برنده شدی! 🏆':'باختی')+'</h2><div style="margin:4px;font-size:15px">'+x.why+'<br>⭐ '+Math.round(score)+' &nbsp; 💰 +'+x.rw+'</div>'+B('go','دوباره','',mis)+B('main','منو','g');
ov.innerHTML='<div class="pn">'+h+'</div>';ov.style.display='flex'}
function act(a,v){aud();
if(a=='main'||a=='mis'||a=='gar'||a=='set')page(a);else if(a=='go')startGame(v);
else if(a=='car'){const c=CARS.find(x=>x.id==v);if(!SV.owned.includes(v)){if(SV.money<c.p){say('پول کافی نیست',1.5);return}SV.money-=c.p;SV.owned.push(v)}SV.car=v;save();setCar();page('gar')}
else if(a=='col'){SV.col[SV.car]=+v;save();setCar();page('gar')}
else if(a=='up'){const k=SV.car+':'+v,l=SV.up[k]||0,cost=1500*(l+1);if(l>=3)return;if(SV.money<cost){say('پول کافی نیست',1.5);return}SV.money-=cost;SV.up[k]=l+1;save();stats();page('gar')}
else if(a=='s'){if(v=='q')SV.q=(SV.q+1)%3;else if(v=='vol'){const o=[1,.5,0];SV.vol=o[(o.indexOf(SV.vol)+1)%3]}else if(v=='sens')SV.sens=SV.sens==1?1.4:SV.sens>1?.7:1;else SV[v]^=1;save();applySet();page('set')}}
ov.addEventListener('pointerdown',e=>{const b=e.target.closest('[data-a]');if(b){e.preventDefault();act(b.dataset.a,b.dataset.v)}});

const mc=$('mm').getContext('2d');
function drawMM(t){const k=.24,c=Math.cos(P.h),s=Math.sin(P.h);mc.setTransform(1,0,0,1,0,0);mc.clearRect(0,0,100,100);mc.save();mc.beginPath();mc.arc(50,50,50,0,6.2832);mc.clip();
mc.setTransform(-k*c,-k*s,k*s,-k*c,50+k*(c*P.x-s*P.z),50+k*(s*P.x+c*P.z));
mc.strokeStyle='#59627a';mc.lineWidth=14;mc.beginPath();
for(let i=Math.floor((P.x-220)/C);i<=Math.ceil((P.x+220)/C);i++){mc.moveTo(i*C,P.z-220);mc.lineTo(i*C,P.z+220)}
for(let j=Math.floor((P.z-220)/C);j<=Math.ceil((P.z+220)/C);j++){mc.moveTo(P.x-220,j*C);mc.lineTo(P.x+220,j*C)}
mc.stroke();
if(mis!='esc'){const dx=tgt[0]-P.x,dz=tgt[1]-P.z,dg=Math.hypot(dx,dz),f=dg>190?190/dg:1;mc.fillStyle='#39ff88';mc.beginPath();mc.arc(P.x+dx*f,P.z+dz*f,24,0,6.2832);mc.fill()}
for(const o of ais)if(o.cop){mc.fillStyle=Math.sin(t*10)>0?'#ff3030':'#3a78ff';mc.beginPath();mc.arc(o.vx,o.vz,16,0,6.2832);mc.fill()}
mc.restore();mc.setTransform(1,0,0,1,0,0);mc.fillStyle='#fff';mc.beginPath();mc.moveTo(50,42);mc.lineTo(44,57);mc.lineTo(56,57);mc.fill()}
// ---------- loop ----------
let last=performance.now(),cyaw=0,fr=0,fr2=0,oa=0;
function frame(now){requestAnimationFrame(frame);const dt=Math.min(.05,(now-last)/1e3);last=now;const t=now/1e3;
if(playing)stepP(dt);upd();{let n=first?999:2;first=0;while(bq.length&&n--){const[i,j]=bq.shift(),q=i+','+j;if(blocks.has(q)){const m=mkBlock(i,j);blocks.set(q,m);sc.add(m)}}}sky(dt);gr.position.set(P.x,0,P.z);
let near=1e9;for(const o of ais){const d=stepAI(o,dt,t);if(o.cop)near=Math.min(near,d)}
if(playing){if(Math.abs(P.v)>30)heat=Math.min(100,heat+6*dt);else if(near>70)heat=Math.max(0,heat-3*dt)}
if(playing&&heat>20&&near<7&&Math.abs(P.v)<9){bust+=dt;if(bust>1.6){bust=0;endGame(0,'پلیس دستگیرت کرد')}}else bust=Math.max(0,bust-dt);
if(playing){tleft-=dt;
if(mis=='esc'){score+=dt*10;heat=Math.max(heat,40);if(tleft<=0)endGame(1,'۹۰ ثانیه دوام آوردی')}
else{score+=Math.abs(P.v)*dt*.15;const dx=tgt[0]-P.x,dz=tgt[1]-P.z,dg=Math.hypot(dx,dz);
if(dg<12)take(0);else if(mis=='race')for(let i=0;i<3&&playing;i++)if(Math.hypot(rac[i].p[0]-tgt[0],rac[i].p[1]-tgt[1])<14)take(i+1);
if(playing&&tleft<=0)endGame(0,'زمان تمام شد');
$('ar').style.transform='rotate('+(-wr(Math.atan2(dx,dz)-P.h))+'rad)';$('dist').textContent=Math.round(dg)+' m'}
$('info').textContent='⏱ '+Math.max(0,Math.ceil(tleft))+(mis=='esc'?'':mis=='race'?' | 🏁 '+cpN+'-'+Math.max(rs[0],rs[1],rs[2]):' | 🏁 '+cpN+'/'+GOALS[mis])+' | ⭐ '+Math.round(score);$('hp').style.width=health+'%';$('hp').style.background=health>50?'#3be07a':health>25?'#ffc83c':'#ff4a3c'}
document.body.classList.toggle('mn',!playing);
$('arr').style.display=playing&&mis!='esc'?'block':'none';$('mm').style.display=playing?'block':'none';$('nit').textContent='🔥'+Math.round(nitE);if(playing&&(fr2++&1)==0)drawMM(t);
me.g.position.set(P.x,0,P.z);me.g.rotation.set(P.pitch,P.h,P.steer*Math.min(1,Math.abs(P.v)/30)*.05);
me.tl.color.set(K.brk&&Math.abs(P.v)>.3?0xff2a2a:(K.gas&&gear<0?0xe8e8e8:0x8a1212));spin(me,P.v,P.steer,dt);
const fx=Math.sin(P.h),fz=Math.cos(P.h);
spot.position.set(P.x+fx*2,1,P.z+fz*2);spot.target.position.set(P.x+fx*30,0,P.z+fz*30);
shake=Math.max(0,shake-dt*2.5);const sh=shake*.35+Math.abs(P.v)*.0012+(boost?.12:0);
if(!playing){oa+=dt*.35;cam.position.set(P.x+Math.sin(oa)*7.5,2,P.z+Math.cos(oa)*7.5);cam.lookAt(P.x,.9,P.z);me.g.visible=1;dash.visible=0}else if(mode==0){cyaw+=wr(P.h-cyaw)*Math.min(1,5*dt);const cx=Math.sin(cyaw),cz=Math.cos(cyaw),dist=7+Math.abs(P.v)*.04;
cam.position.set(P.x-cx*dist,2.8+(Math.random()-.5)*sh*.3,P.z-cz*dist);cam.lookAt(P.x+cx*8,1.3,P.z+cz*8);me.g.visible=1;dash.visible=0;$('vg').style.display='none'}
else{cyaw=P.h;cam.position.set(P.x+fx*.2+Math.cos(P.h)*.4,1.2+Math.sin(t*40)*sh*.12,P.z+fz*.2-Math.sin(P.h)*.4);
cam.lookAt(P.x+fx*12,1.1+P.pitch*8,P.z+fz*12);me.g.visible=0;dash.visible=1;$('vg').style.display='block';wS.rotation.z=-P.steer*1.6;
const v=Math.abs(P.v),g=Math.min(5,Math.floor(v/9)+1),rpm=Math.min(8000,900+(v-(g-1)*9)/9*5200);
if((fr++&3)==0){drawCl(v*3.6,rpm,gear<0?'R':g);drawNav()}if(SV.mir&&(fr&1)==0)mirrors()}
cam.rotateZ(-P.steer*P.v*.0006+(Math.random()-.5)*sh*.02);
cam.fov+=((mode?74:62)+(boost?10:0)+Math.abs(P.v)*.4-cam.fov)*Math.min(1,4*dt);cam.updateProjectionMatrix();
if(eng){const v=Math.abs(P.v),gg=Math.min(5,Math.floor(v/9)+1),r=(v-(gg-1)*9)/9;eng.o.frequency.value=45+r*70+gg*6+(K.gas?10:0);eng.o2.frequency.value=eng.o.frequency.value*.5;eng.f.frequency.value=350+(K.gas?900:200)+r*300;eng.g.gain.value=(.03+(K.gas?.035:0))*SV.vol}
if(sir){sir.o.frequency.value=800+320*Math.sin(t*6);sir.g.gain.value=heat>20?Math.max(0,1-near/140)*.05*SV.vol:0}
$('spd').firstChild.nodeValue=Math.round(Math.abs(P.v)*3.6)+' ';
const n=Math.ceil(heat/20);$('heat').textContent='★'.repeat(n)+'☆'.repeat(5-n);
if(msgT>0&&(msgT-=dt)<=0)$('msg').style.display='none';
ren.render(sc,cam)}
setGear();applySet();setCar();page('main');requestAnimationFrame(frame);
</script>
